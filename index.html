<!DOCTYPE html>
<html lang="tr">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ses Çalan Buton</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Butonun tasarımı */
        .ses-butonu {
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        .ses-butonu:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <button class="ses-butonu" onclick="sesiCal()">🎵 Sesi Çal</button>

    <audio id="benimSesim" src="https://codesandbox.io/smarthome.mp3"></audio>

    <script>
        function sesiCal() {
            var ses = document.getElementById("benimSesim");
            ses.play().catch(function(error) {
                alert("Lütfen önce sayfada boş bir yere tıklayın, ardından butona basın!");
            });
        }
    </script>

</body>
</html>
